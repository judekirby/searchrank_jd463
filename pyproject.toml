[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judekirby-searchrank_jd463"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告搜索排序算法工程师·分块策略对召回的影响相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "judekirby" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://judekirby.github.io"
Repository = "https://github.com/judekirby/searchrank_jd463"
Issues = "https://github.com/judekirby/searchrank_jd463/issues"

[project.scripts]
searchrank_jd463 = "searchrank_jd463:main"

[tool.setuptools]
py-modules = ["searchrank_jd463"]
